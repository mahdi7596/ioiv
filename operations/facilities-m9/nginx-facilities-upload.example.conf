# Place inside the sana.ioiv.ir HTTPS server block only after staging validation.
# Nginx `m` units are MiB. 26 MiB leaves multipart overhead above the 25 MiB
# application file limit; the application remains the authoritative content/size gate.
location ^~ /api/facilities/application-files {
    client_max_body_size 26m;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
