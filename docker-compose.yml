services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    container_name: sana-app
    restart: unless-stopped
    # Runtime-only application secrets (APP_URL, SESSION_SECRET, SMS/payment
    # credentials, and restricted DATABASE_URL). This file must never contain an
    # owner password.
    env_file:
      - path: .env.runtime
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    # Loopback only: nginx on the same host proxies to 127.0.0.1:3000. Publishing
    # on all interfaces would let anyone bypass nginx's body-size limits.
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - sana-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    # Run only as an explicit maintenance operation:
    # docker compose --profile migration run --rm migrate
    profiles: ["migration"]
    build:
      context: .
      dockerfile: Dockerfile
      target: maintenance
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    # This maintenance-only file contains the migration-owner DATABASE_URL, but
    # is deliberately never passed to the app service.
    env_file:
      - path: .env.migration
        required: false
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sana}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Loopback only. Reach it from a workstation through an SSH tunnel:
    #   ssh -L 55433:127.0.0.1:55433 <server>
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - sana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sana}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sana-postgres-data:
  sana-uploads:
